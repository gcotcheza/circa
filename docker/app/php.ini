; =============================================================================
; Health Tracker — PHP runtime overrides
; =============================================================================
; Health Auto Export can emit large bodies and fires several batched POSTs in a
; row, so the request-size and memory ceilings are set generously. The hard cap
; on the whole path is Cloudflare's free-plan 100 MB/request limit; nginx is set
; to 100m and PHP sits just above it so PHP is never the thing that truncates.
; =============================================================================

memory_limit = 256M
post_max_size = 128M
upload_max_filesize = 128M
max_file_uploads = 100

max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

; Raw ingest reads php://input directly; keep it re-readable for debugging.
expose_php = Off

; Never split SCRIPT_FILENAME into script + PATH_INFO looking for something
; executable. The sidecar sets SCRIPT_FILENAME to a fully resolved path and now
; refuses to forward a request whose script does not exist (`try_files $uri
; =404` in docker/web/nginx.conf), so this changes nothing about how the app is
; served — it removes the fallback that made "/uploads/photo.jpg/x.php" a class
; of bug in the first place. Two independent layers, because the interesting
; failures here are the ones where one of them is misconfigured.
;
; Laravel never reads PATH_INFO: Symfony derives the path from REQUEST_URI.
cgi.fix_pathinfo = 0

date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
